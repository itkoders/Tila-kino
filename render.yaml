services:
  - type: web
    name: tilakino-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ID
        value: "6359925487"
      - key: BOT_USERNAME
        sync: false
      - key: WELCOME_GIF_FILE_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
