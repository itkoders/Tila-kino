<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TILAKINO{% endblock %}</title>
<style>
:root{--bg:#0b0d14;--panel:#141824;--line:#232a3d;--text:#eef1f8;--muted:#8d97b3;--accent:#ff6a3d;--accent2:#ffb03d}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--panel:#fff;--line:#e2e6f0;--text:#161a28;--muted:#5d6784}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);animation:drop .5s ease both}
header .wrap{display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.06em;font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
form.search{flex:1 1 220px;min-width:0;display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;transition:border-color .2s,box-shadow .2s}
input[type=search]:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0d05;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--accent)}
.btn:active{transform:scale(.97)}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:all .2s}
.tab:hover,.tab.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*45ms)}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--accent);box-shadow:0 16px 32px -16px #000a}
.poster{aspect-ratio:2/3;background:linear-gradient(110deg,var(--panel) 30%,var(--line) 50%,var(--panel) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .6s}
.poster img.ok{opacity:1}
.card:hover .poster img{transform:scale(1.06)}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;opacity:.5}
.badge{position:absolute;top:8px;left:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.meta{padding:10px 12px}
.meta b{display:block;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 0;animation:rise .6s both}
.empty .big{font-size:56px;display:block;animation:float 3s ease-in-out infinite}
footer{border-top:1px solid var(--line);color:var(--muted);padding:20px 0;font-size:14px;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes shine{to{background-position:200% 0}}
@keyframes float{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}.card{opacity:1}}
{% block css %}{% endblock %}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/">🎬 TILAKINO</a>
  <form class="search" action="/" method="get">
    <input type="search" name="q" placeholder="Nom yoki kod bo'yicha qidirish…" value="{{ q or '' }}" maxlength="80" aria-label="Qidirish">
    <button class="btn" type="submit">🔎</button>
  </form>
</div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
<footer><div class="wrap">TILAKINO © — faqat ruxsat etilgan kontent{% if bot %} · <a href="https://t.me/{{ bot }}">Telegram bot</a>{% endif %}</div></footer>
<script>
document.querySelectorAll('.poster img').forEach(function(i){
  function ok(){i.classList.add('ok')}
  if(i.complete&&i.naturalWidth){ok()}else{i.addEventListener('load',ok);i.addEventListener('error',function(){i.remove()})}
});
</script>
</body>
</html>
